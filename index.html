    <style>
        /* 基礎設定與簡約白色風格 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.6;
            padding: 0 20px 40px 20px; /* 底部留白方便捲動對齊 */
            max-width: 600px;
            margin: 0 auto;
        }

        /* 功能 2: 固定頂部控制列 (Sticky Header) 與毛玻璃特效 */
        header { 
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 0 10px 0;
            border-bottom: 1px solid #f0f0f0;
            text-align: center;
            margin-bottom: 24px;
        }
        
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 16px; color: #111; }
        .control-group {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }
        input[type="date"] {
            padding: 10px 16px;
            font-size: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            background-color: #fafafa;
            transition: border-color 0.2s;
            color: #333;
        }
        input[type="date"]:focus { border-color: #999; }

        .status-bar {
            text-align: center;
            font-size: 0.95rem;
            color: #666;
            padding-bottom: 5px;
        }

        /* 課表卡片容器 */
        #schedule-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 10px;
        }
        .period-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            scroll-margin-top: 150px; /* 捲動對齊時預留上方間距，避免被 Sticky Header 遮住 */
        }
        
        /* 當前節次高亮樣式 (淺黃色) */
        .period-card.active-period {
            background-color: #fffde7; 
            box-shadow: 0 4px 12px rgba(251, 192, 45, 0.15);
        }
        .period-card.active-period .period-header {
            color: #f57f17;
            border-left-color: #f57f17;
        }
        .period-card.active-period .class-item {
            background-color: #ffffff;
            border-color: #fff59d;
        }

        /* 即將上課預備樣式 (淺綠色) */
        .period-card.upcoming-period {
            background-color: #e8f5e9;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.15);
        }
        .period-card.upcoming-period .period-header {
            color: #2e7d32;
            border-left-color: #2e7d32;
        }
        .period-card.upcoming-period .class-item {
            background-color: #ffffff;
            border-color: #a5d6a7;
        }

        .period-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #111;
            border-left: 4px solid #333;
            padding-left: 8px;
        }
        .class-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
        .class-item {
            background: #fafafa;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #f5f5f5;
        }
        .class-name { font-weight: 600; color: #000; }
        .teacher-name { color: #555; font-size: 0.85rem; }
        .venue-name { color: #222; font-weight: 600; margin-top: 4px; }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 0;
            font-size: 0.95rem;
        }
    </style>
</head>

                4: "11:15 ~ 12:00",
                5: "13:15 ~ 14:00",
                6: "14:15 ~ 15:00",
                7: "15:20 ~ 16:05",
                8: "16:15 ~ 17:00"
            };

            const prepStartTimes = {
                1: "07:30", 2: "09:00", 3: "10:00", 4: "11:00",
                5: "12:00", 6: "14:00", 7: "15:00", 8: "16:05"
            };

            // DOM 元素
            const datePicker = document.getElementById('date-picker');
            const statusText = document.getElementById('status-text');
            const container = document.getElementById('schedule-container');

            function getVenueIcon(venue) {
                if (!venue) return '未安排';
                if (venue === 'X') return '本週無安排';
                if (venue.includes('籃球')) return '🏀 ' + venue;
                if (venue.includes('排球')) return '🏐 ' + venue;
                if (venue.includes('遊戲')) return '🤾 ' + venue;
                return venue;
            }

            function getWeekNumber(dateStr) {
                const targetDate = new Date(dateStr);
                for (const r of weekRanges) {
                    const start = new Date(r.start);
                    const end = new Date(r.end);
                    end.setHours(23, 59, 59);
                    if (targetDate >= start && targetDate <= end) return r.week;
                }
                return null;
            }

            function timeToMins(timeStr) {
                const parts = timeStr.split(':');
                return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            }

            function renderSchedule(dateStr) {
                container.innerHTML = '';
                const selectedDate = new Date(dateStr);
                const dayOfWeek = selectedDate.getDay();
                const weekNum = getWeekNumber(dateStr);

                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                const isToday = (dateStr === todayStr);
                const currentMins = now.getHours() * 60 + now.getMinutes();

                const dayNames = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
                statusText.textContent = weekNum ? `${dateStr} (${dayNames[dayOfWeek]}) | 第 ${weekNum} 週` : `${dateStr} (${dayNames[dayOfWeek]}) | 非學期排課區間`;

                if (dayOfWeek === 0 || dayOfWeek === 6 || !scheduleData[dayOfWeek]) {
                    container.innerHTML = `<div class="empty-state">本日無體育課程安排</div>`;
                    return;
                }

                let targetCard = null;

                for (let period = 1; period <= 8; period++) {
                    const periodClasses = scheduleData[dayOfWeek][period];
                    if (!periodClasses || periodClasses.length === 0) continue;

                    const card = document.createElement('div');
                    card.className = 'period-card';

                    // 顏色與捲動邏輯
                    if (isToday && periodTimes[period]) {
                        const times = periodTimes[period].split(' ~ ');
                        const startMins = timeToMins(times[0]);
                        const endMins = timeToMins(times[1]);
                        const prepMins = timeToMins(prepStartTimes[period]);

                        if (currentMins >= startMins && currentMins <= endMins) {
                            card.classList.add('active-period');
                            targetCard = card;
                        } else if (currentMins >= prepMins && currentMins < startMins) {
                            card.classList.add('upcoming-period');
                            targetCard = card;
                        }
                    }
                    
                    const header = document.createElement('div');
                    header.className = 'period-header';
                    header.textContent = `第 ${period} 節 - ${periodTimes[period]}`;
                    card.appendChild(header);

                    const classList = document.createElement('div');
                    classList.className = 'class-list';

                    periodClasses.forEach(item => {
                        const classDiv = document.createElement('div');
                        classDiv.className = 'class-item';
                        const tGroup = teacherGroups[item.t];
                        const venue = (weekNum && venueData[weekNum] && tGroup) ? venueData[weekNum][tGroup] : "查無資料";
                        classDiv.innerHTML = `<span class="class-name">${item.cls} 班</span><span class="teacher-name">${item.t} 老師</span><span class="venue-name">${getVenueIcon(venue)}</span>`;
                        classList.appendChild(classDiv);
                    });

                    card.appendChild(classList);
                    container.appendChild(card);
                }

                // 功能 3: 自動平滑捲動到當前/即將上課節次
                if (targetCard) {
                    setTimeout(() => {
                        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                }
            }

            // 初始化日期
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISODate = (new Date(today - offset)).toISOString().split('T')[0];
            datePicker.value = localISODate;
            renderSchedule(localISODate);

            datePicker.addEventListener('change', (e) => {
                if(e.target.value) renderSchedule(e.target.value);
            });

            // 背景自動重繪
            setInterval(() => renderSchedule(datePicker.value), 60000);

            // 功能: Visibility Change (背景喚醒自動更新)
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    renderSchedule(datePicker.value);
                }
            });
        });
    </script>
</body>
</html>
