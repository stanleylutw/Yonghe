        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            color: #333333;
            line-height: 1.6;

        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 16px; color: #111; }
        .control-group {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        input[type="date"] {
            padding: 10px 16px;
            font-size: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            background-color: #fafafa;
            transition: border-color 0.2s;
            color: #333;
        }
        input[type="date"]:focus { border-color: #999; }

        /* 狀態提示列 */
        .status-bar {
            text-align: center;
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        /* 課表卡片容器 */
        #schedule-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .period-card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .period-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #111;
            border-left: 4px solid #333;
            padding-left: 8px;
        }
        .class-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
        .class-item {
            background: #fafafa;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #f5f5f5;
        }
        .class-name { font-weight: 600; color: #000; }
        .teacher-name { color: #555; font-size: 0.85rem; }
        .venue-name { color: #222; font-weight: 600; margin-top: 4px; }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 0;
            font-size: 0.95rem;
        }

                    statusText.textContent = `${dateStr} (${dayNames[dayOfWeek]}) | 非學期排課區間`;
                } else {
                    statusText.textContent = `${dateStr} (${dayNames[dayOfWeek]}) | 第 ${weekNum} 週`;
                }

                // 錯誤處理：非平日或找不到週次、課表資料
                if (dayOfWeek === 0 || dayOfWeek === 6 || !scheduleData[dayOfWeek]) {
                    container.innerHTML = `<div class="empty-state">本日無體育課程安排</div>`;
                    return;
                }

                // 渲染 1 到 8 節
                for (let period = 1; period <= 8; period++) {
                    const periodClasses = scheduleData[dayOfWeek][period];
                    
                    if (!periodClasses || periodClasses.length === 0) continue;

                    // 建立節次卡片
                    const card = document.createElement('div');
                    card.className = 'period-card';
                    
                    const header = document.createElement('div');
                    header.className = 'period-header';
                    header.textContent = `第 ${period} 節`;
                    card.appendChild(header);

                    const classList = document.createElement('div');
                    classList.className = 'class-list';

                    // 迴圈處理該節的每一個班級
                    periodClasses.forEach(item => {
                        const classDiv = document.createElement('div');
                        classDiv.className = 'class-item';
                        
                        // 查表獲取場地
                        const tGroup = teacherGroups[item.t];
                        let finalVenue = "查無資料";
                        
                        if (weekNum && venueData[weekNum] && tGroup) {
                            finalVenue = venueData[weekNum][tGroup];
                        }

                        // 組合卡片內容
                        classDiv.innerHTML = `
                            <span class="class-name">${item.cls} 班</span>
                            <span class="teacher-name">${item.t} 老師</span>
                            <span class="venue-name">${getVenueIcon(finalVenue)}</span>
                        `;
                        classList.appendChild(classDiv);
                    });

                    card.appendChild(classList);
                    container.appendChild(card);
                }
            }

            // 初始化：自動抓取當天日期並帶入
            const today = new Date();
            // 處理時區偏移量，確保取得本地正確的 YYYY-MM-DD
            const offset = today.getTimezoneOffset() * 60000;
            const localISODate = (new Date(today - offset)).toISOString().split('T')[0];
            
            datePicker.value = localISODate;
            renderSchedule(localISODate);

            // 綁定 Date Picker 變更事件
            datePicker.addEventListener('change', (e) => {
                if(e.target.value) renderSchedule(e.target.value);
            });
        });
    </script>
</body>
</html>
